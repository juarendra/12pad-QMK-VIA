name: Build 12pad firmware

on:
  push:
    paths:
      - "FIRMWARE/positron/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli:latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup qmk_firmware
        run: qmk setup -y -H /qmk_firmware qmk/qmk_firmware

      - name: Copy keyboard into qmk_firmware
        run: cp -r FIRMWARE/positron /qmk_firmware/keyboards/positron

      - name: Lint
        run: qmk lint -kb positron/12pad -km via --strict

      - name: Compile default keymap
        run: qmk compile -kb positron/12pad -km default

      - name: Compile via keymap
        run: qmk compile -kb positron/12pad -km via

      - name: Upload firmware binaries
        uses: actions/upload-artifact@v4
        with:
          name: positron_12pad
          path: /qmk_firmware/positron_12pad_*.bin
